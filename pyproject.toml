[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "orbidyn"
version = "0.1.0"
description = "Python bindings for the odecraft ODE solver library"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "scipy",
    "numiphy @ git+https://github.com/phyzan/numiphy.git@df76104665537fd464fff55d8f697f6e58d94376",
    # Must match external/pybind11 (vendored submodule) exactly: JIT-compiled user code
    # (numiphy's compile_tools.py, via pybind11.get_include()) links against this pip
    # package's headers, while orbidyn's precompiled extensions are built against the
    # submodule. A pybind11 version mismatch between the two breaks cross-module type
    # identity (e.g. passing a RegularScalarField into JIT-compiled code fails at runtime).
    "pybind11==3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.build-type = "Release"

build-dir = "build"
wheel.packages = ["python/orbidyn"]

[[tool.scikit-build.overrides]]
if.env.CIBUILDWHEEL = true
build-dir = "build/{wheel_tag}"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
# musl is untested here; the C++20 sources need a recent libstdc++ toolchain.
skip = "*-musllinux_*"
archs = ["x86_64"]
build-frontend = "build"
test-command = "python -c \"import orbidyn; print(orbidyn.__file__)\""

[tool.cibuildwheel.linux]
# AlmaLinux 8 base: GCC 14 devtoolset, glibc 2.28 - needed for the C++20 sources.
manylinux-x86_64-image = "manylinux_2_28"
# qhull-devel (with libqhull_r) is in AlmaLinux 8's PowerTools repository, off by default.
before-all = "dnf install -y --enablerepo=powertools mpfr-devel gmp-devel qhull-devel"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }
